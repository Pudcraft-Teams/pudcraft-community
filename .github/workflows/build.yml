name: Build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pudcraft-community" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            S3_BUCKET=${{ secrets.S3_BUCKET || vars.S3_BUCKET }}
            S3_REGION=${{ secrets.S3_REGION || vars.S3_REGION }}
            S3_ENDPOINT=${{ secrets.S3_ENDPOINT || vars.S3_ENDPOINT }}
            S3_PUBLIC_BASE_URL=${{ secrets.S3_PUBLIC_BASE_URL || vars.S3_PUBLIC_BASE_URL }}
            S3_FORCE_PATH_STYLE=${{ secrets.S3_FORCE_PATH_STYLE || vars.S3_FORCE_PATH_STYLE }}
            OSS_BUCKET=${{ secrets.OSS_BUCKET || vars.OSS_BUCKET }}
            OSS_ENDPOINT=${{ secrets.OSS_ENDPOINT || vars.OSS_ENDPOINT }}
            OSS_PUBLIC_BASE_URL=${{ secrets.OSS_PUBLIC_BASE_URL || vars.OSS_PUBLIC_BASE_URL }}
            OSS_FORCE_PATH_STYLE=${{ secrets.OSS_FORCE_PATH_STYLE || vars.OSS_FORCE_PATH_STYLE }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
